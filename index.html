<script>
window.addEventListener('error',function(e){
  try{
    var d = document.getElementById('err');
    if(!d){ d = document.createElement('div'); d.id = 'err';
      d.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:99;background:rgba(120,0,20,.92);color:#fff;font:12px/1.3 monospace;padding:8px 10px;border-radius:8px;pointer-events:none';
      document.body.appendChild(d); }
    d.textContent = 'Error: ' + (e.message || 'script failed') + (e.lineno ? ' (line ' + e.lineno + ')' : '');
  }catch(_){}
});
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#12041c;font-family:'Fredoka',sans-serif}
#webgl-canvas{position:fixed;inset:0;width:100vw;height:100vh;z-index:1;outline:none}
#ui-layer{position:fixed;inset:0;z-index:10;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:calc(60px + env(safe-area-inset-top,0px)) 20px calc(42px + env(safe-area-inset-bottom,0px))}
#sky-title{margin-top:12vh;font-size:clamp(2rem,8vw,3.6rem);color:#fff8e7;text-align:center;text-shadow:0 0 12px #ffae00,0 0 28px #ff5e00,0 0 55px #f05;opacity:0;transform:scale(.75);transition:opacity .8s ease,transform .8s cubic-bezier(.175,.885,.32,1.275)}
#sky-title.visible{opacity:1;transform:scale(1)}
#hint-banner{background:rgba(25,8,38,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1.5px solid rgba(255,200,100,.45);color:#ffe8b6;padding:10px 22px;border-radius:999px;font-size:clamp(.92rem,2.2vw,1.1rem);box-shadow:0 8px 28px rgba(0,0,0,.45);opacity:0;transform:translateY(-10px);transition:all .4s ease;text-align:center;max-width:92vw}
#hint-banner.show{opacity:1;transform:translateY(0)}
#action-btn{pointer-events:none;background:linear-gradient(135deg,#ffe268,#ffb327);color:#4a2100;border:2px solid #fff3b0;padding:14px 34px;font-family:'Fredoka',sans-serif;font-size:clamp(1rem,2.5vw,1.2rem);font-weight:700;border-radius:999px;cursor:pointer;box-shadow:0 0 22px rgba(255,190,40,.8),0 8px 20px rgba(0,0,0,.4);transform:translateY(20px) scale(.9);opacity:0;transition:transform .3s cubic-bezier(.34,1.56,.64,1),opacity .3s ease}
#action-btn.active{pointer-events:auto;opacity:1;transform:none;animation:pulseGlow 1.8s infinite ease-in-out}
#action-btn:active{transform:scale(.96)}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 18px rgba(255,190,40,.75),0 6px 18px rgba(0,0,0,.4)}50%{box-shadow:0 0 34px rgba(255,220,90,1),0 8px 24px rgba(0,0,0,.5)}}
#final-card{position:fixed;top:36%;left:50%;transform:translate(-50%,-50%) scale(.85);background:linear-gradient(135deg,rgba(255,255,255,.24),rgba(255,196,140,.12));backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border:1.5px solid rgba(255,225,170,.55);border-radius:22px;padding:14px 20px 16px;max-width:330px;width:86%;text-align:center;color:#fff4e0;box-shadow:0 12px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.35);z-index:25;opacity:0;pointer-events:none;transition:all .5s cubic-bezier(.34,1.56,.64,1)}
#final-card.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
#final-card h2{font-family:'Dancing Script',cursive;font-size:1.65rem;color:#ffd6e0;margin-bottom:6px;text-shadow:0 2px 10px rgba(0,0,0,.45)}
#final-card p{font-size:.86rem;line-height:1.42;color:#fff1dc;margin-bottom:10px;text-shadow:0 1px 6px rgba(0,0,0,.5)}
#replay-btn{background:linear-gradient(135deg,#ff5e7e,#d92648);color:#fff;border:none;padding:8px 20px;border-radius:999px;font-family:'Fredoka',sans-serif;font-size:.9rem;font-weight:600;cursor:pointer;box-shadow:0 6px 18px rgba(217,38,72,.45)}
@media (prefers-reduced-motion:reduce){#action-btn.active{animation:none}}
html,body{touch-action:none}
#mute-btn{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:30;width:42px;height:42px;border-radius:50%;border:1.5px solid rgba(255,200,100,.5);background:rgba(25,8,38,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#ffe8b6;font-size:1.2rem;cursor:pointer;pointer-events:auto}
#mute-btn.off{opacity:.55}
#trail{position:fixed;inset:0;width:100vw;height:100vh;z-index:12;pointer-events:none}
#toast{position:fixed;top:22%;left:50%;transform:translate(-50%,-12px);z-index:26;max-width:88vw;background:rgba(255,248,238,.95);color:#8a1c3a;border:2px solid #ffae34;border-radius:20px;padding:12px 20px;font-weight:600;text-align:center;opacity:0;pointer-events:none;transition:all .4s ease;box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 24px rgba(255,170,40,.5)}
#toast.show{opacity:1;transform:translate(-50%,0)}

<body>
<canvas id="webgl-canvas"></canvas>
<canvas id="trail"></canvas>
<button id="mute-btn" aria-label="Toggle sound">🎵</button>
<div id="toast"></div>
<div id="ui-layer">
  <div id="hint-banner" class="show">✨ Tap below to start our Diwali surprise ✨</div>
  <div id="sky-title"></div>
  <button id="action-btn" class="active">Start Diwali Surprise 🎇</button>
</div>
<div id="final-card">
  <h2>Happy Diwali, My Love! 🪔❤️</h2>
  <p>Har diya teri muskurahat ke naam, har roshni hamare saath ke naam.<br>Every Diwali is magical because of you, my <strong>Kuchupuchu</strong>! ✨</p>
  <button id="replay-btn" onclick="location.reload()">Replay Our Diwali 🎆</button>
</div>

<script>
/* ---------- CUSTOMIZE NAMES & MESSAGES ---------- */
const CONFIG = {
  coupleTitle: "Cutie ❤️ Kuchupuchu",
  bannerMainText: "Happy Diwali",
  bannerSubText: "Cutie ❤️ Kuchupuchu",
  sweetCardTop: "100% Pure Love",
  sweetCardBottom: "Sweetest Thing Here"
};
document.getElementById('sky-title').innerText = CONFIG.coupleTitle;

/* ---------- AUDIO ---------- */
let audioCtx = null, master = null, reverb = null, pinkBuf = null, whiteBuf = null;
function initAudio(){
  try{
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const sr = audioCtx.sampleRate;
      master = audioCtx.createGain(); master.gain.value = .9; master.connect(audioCtx.destination);
      // small generated room reverb
      reverb = audioCtx.createConvolver();
      const ir = audioCtx.createBuffer(2,sr*2.2|0,sr);
      for(let c=0;c<2;c++){ const d = ir.getChannelData(c); for(let i=0;i<d.length;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/d.length,3); }
      reverb.buffer = ir;
      const rg = audioCtx.createGain(); rg.gain.value = .5; reverb.connect(rg); rg.connect(master);
      // white + pink noise buffers
      whiteBuf = audioCtx.createBuffer(1,sr*2,sr); pinkBuf = audioCtx.createBuffer(1,sr*2,sr);
      const w = whiteBuf.getChannelData(0), k = pinkBuf.getChannelData(0);
      let b0=0,b1=0,b2=0;
      for(let i=0;i<w.length;i++){
        const r = Math.random()*2-1; w[i] = r;
        b0 = .99765*b0 + r*.099046; b1 = .963*b1 + r*.2965164; b2 = .57*b2 + r*1.0526913;
        k[i] = (b0+b1+b2+r*.1848)*.25;
      }
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }catch(e){}
  return audioCtx;
}
function route(node,send=0){
  node.connect(master);
  if(send){ const s = audioCtx.createGain(); s.gain.value = send; node.connect(s); s.connect(reverb); }
}
function envGain(t,peak,attack,decay){
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(.0001,t);
  g.gain.linearRampToValueAtTime(peak,t+attack);
  g.gain.exponentialRampToValueAtTime(.0001,t+attack+decay);
  return g;
}
// Warm plucked string (triangle + sine, 0.01s attack, exponential decay)
function pluck(freq,vol=.15,decay=1.4,when=0){
  if(!initAudio()) return;
  const t = audioCtx.currentTime+when;
  const lp = audioCtx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3200;
  const g = envGain(t,vol,.01,decay);
  [['triangle',freq,1],['sine',freq*2,.35]].forEach(([type,f,a])=>{
    const o = audioCtx.createOscillator(), og = audioCtx.createGain();
    o.type = type; o.frequency.value = f; og.gain.value = a;
    o.connect(og); og.connect(lp); o.start(t); o.stop(t+decay+.1);
  });
  lp.connect(g); route(g,.25);
}
function playChime(freq=659.25){ pluck(freq,.12,1.2); }   // soft pluck, no electronic glide
// Diya: flame ignition whoosh (300Hz -> 1200Hz in 0.25s) layered with a harp/sitar pluck
function playIgnite(i=0){
  if(!initAudio()) return;
  const t = audioCtx.currentTime;
  const src = audioCtx.createBufferSource(); src.buffer = pinkBuf; src.loop = true;
  const bp = audioCtx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.4;
  bp.frequency.setValueAtTime(300,t); bp.frequency.exponentialRampToValueAtTime(1200,t+.25);
  const g = envGain(t,.3,.05,.3);
  src.connect(bp); bp.connect(g); route(g,.2);
  src.start(t,Math.random()); src.stop(t+.42);
  pluck([293.66,369.99,440,493.88][i%4],.13,1.5,.06);
}
// Brass ghanti: clapper strike (1480Hz -> 320Hz in 45ms) + inharmonic overtones ringing ~4s
function playTempleBell(){
  if(!initAudio()) return;
  const t = audioCtx.currentTime, base = 784;
  const k = audioCtx.createOscillator(); k.type = 'triangle';
  k.frequency.setValueAtTime(1480,t); k.frequency.exponentialRampToValueAtTime(320,t+.045);
  const kg = envGain(t,.3,.002,.07); k.connect(kg); route(kg,.15); k.start(t); k.stop(t+.12);
  [0.5,1.0,1.003,1.183,1.506,2.0,2.756,3.85].forEach((r,i)=>{
    const dec = Math.max(1.4,4.2-i*.35), o = audioCtx.createOscillator(); o.type = 'sine'; o.frequency.value = base*r;
    const g = envGain(t,.16/(1+i*.3),.005,dec);
    o.connect(g); route(g,.35); o.start(t); o.stop(t+dec+.1);
  });
}
// Street lights: rapid pentatonic wind-chime cascade, very soft, long reverb tail
function playWindChimes(){
  if(!initAudio()) return;
  const t = audioCtx.currentTime;
  [1046,1174,1318,1567,1760,2093].forEach((f,i)=>{
    const t0 = t+i*.065+Math.random()*.02;
    [[f,1],[f*2.756,.25]].forEach(([fr,a])=>{
      const o = audioCtx.createOscillator(); o.type = 'sine'; o.frequency.value = fr;
      const g = envGain(t0,.04*a,.005,1.6);
      o.connect(g); route(g,.7); o.start(t0); o.stop(t0+1.7);
    });
  });
}
function playFireworkPop(vol=.35){
  if(!initAudio()) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(40,t+.4);
  const g = envGain(t,vol*1.4,.004,.5); o.connect(g); route(g,.15); o.start(t); o.stop(t+.6);
  const n = audioCtx.createBufferSource(); n.buffer = whiteBuf;
  const lp = audioCtx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 500;
  const ng = envGain(t,vol*.8,.004,.4); n.connect(lp); lp.connect(ng); route(ng,.2); n.start(t,Math.random()*1.5); n.stop(t+.5);
}
// Continuous sparkler sizzle: 4800Hz high-passed white noise with flutter and random micro-pops
let sizzle = null;
function startSizzle(){
  if(!initAudio() || sizzle) return;
  const src = audioCtx.createBufferSource(); src.buffer = whiteBuf; src.loop = true;
  const hp = audioCtx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 3200; hp.Q.value = .7;
  const g = audioCtx.createGain(); g.gain.value = 0; g.gain.setTargetAtTime(.06,audioCtx.currentTime,.3);
  src.connect(hp); hp.connect(g); g.connect(master); src.start();
  const iv = setInterval(()=>{
    const now = audioCtx.currentTime;
    g.gain.setTargetAtTime(.025+Math.random()*.06,now,.02);
    if(Math.random()<.35){
      const p = audioCtx.createBufferSource(); p.buffer = whiteBuf;
      const ph = audioCtx.createBiquadFilter(); ph.type = 'highpass'; ph.frequency.value = 3200+Math.random()*2500;
      const pg = audioCtx.createGain(); const dur = .012+Math.random()*.012;
      pg.gain.setValueAtTime(.05+Math.random()*.1,now); pg.gain.exponentialRampToValueAtTime(.0001,now+dur);
      p.connect(ph); ph.connect(pg); pg.connect(master); p.start(now,Math.random()*1.5,.03);
    }
  },55);
  sizzle = {src,g,iv};
}
function stopSizzle(){
  if(!sizzle) return;
  const z = sizzle; sizzle = null; clearInterval(z.iv);
  z.g.gain.setTargetAtTime(0,audioCtx.currentTime,.4);
  setTimeout(()=>{ try{ z.src.stop(); }catch(e){} },2500);
}

// Soft pentatonic music box loop + mute toggle
let musicTimer = null, musicBus = null, muted = false;
const PENTA = [523.25,587.33,659.25,783.99,880,1046.5], MEL = [0,2,4,2,3,5,4,2,0,2,4,5,4,2,1,-1];
function startMusic(){ try{ _startMusic(); }catch(e){} }
function _startMusic(){
  if(!initAudio() || musicTimer) return;
  musicBus = audioCtx.createGain(); musicBus.gain.value = .5; route(musicBus,.4);
  let i = 0;
  musicTimer = setInterval(()=>{
    const t = audioCtx.currentTime, n = MEL[i%16];
    const note = (f,v,dec)=>{ const o = audioCtx.createOscillator(); o.type = 'sine'; o.frequency.value = f; const g = envGain(t,v,.004,dec); o.connect(g); g.connect(musicBus); o.start(t); o.stop(t+dec+.1); };
    if(n>=0){ note(PENTA[n],.07,1.6); note(PENTA[n]*4,.02,.5); }
    if(i%8===0) note(PENTA[(i%16)<8?0:3]/2,.05,2.2);
    i++;
  },480);
}
const muteBtn = document.getElementById('mute-btn');
if(muteBtn) muteBtn.addEventListener('click',()=>{
  try{ initAudio(); startMusic(); }catch(e){}
  muted = !muted;
  try{ master.gain.setTargetAtTime(muted?0:.9,audioCtx.currentTime,.05); }catch(e){}
  muteBtn.textContent = muted ? '🔇' : '🎵'; muteBtn.classList.toggle('off',muted);
});

['pluck','playChime','playIgnite','playTempleBell','playWindChimes','playFireworkPop','startSizzle','stopSizzle'].forEach(function(n){
  var f = window[n]; if(typeof f !== 'function') return;
  window[n] = function(){ try{ return f.apply(this,arguments); }catch(e){} };
});

/* ---------- RENDERER, CAMERA (responsive FOV) ---------- */
const isPortrait = () => innerWidth/innerHeight < .75;
const canvas = document.getElementById('webgl-canvas');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x28062e);
scene.fog = new THREE.FogExp2(0x28062e, 0.009);
const camera = new THREE.PerspectiveCamera(46, innerWidth/innerHeight, .1, 300);
function fitCamera(){
  camera.fov = isPortrait() ? 68 : 46;
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
}
fitCamera();
camera.position.set(0,14,28);
const cameraTarget = new THREE.Vector3(0,25,-15);
camera.lookAt(cameraTarget);

const renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const maxAniso = renderer.capabilities.getMaxAnisotropy();
addEventListener('resize',()=>{ fitCamera(); renderer.setSize(innerWidth,innerHeight); });

scene.add(new THREE.AmbientLight(0xffd2b3,.7));
const moon = new THREE.DirectionalLight(0xffdfba,.75);
moon.position.set(18,35,22); moon.castShadow = true;
moon.shadow.mapSize.set(1024,1024);
Object.assign(moon.shadow.camera,{left:-30,right:30,top:30,bottom:-30,far:120});
scene.add(moon);
const streetGlow = new THREE.PointLight(0xff9436,1.3,45);
streetGlow.position.set(0,8,2); scene.add(streetGlow);

/* ---------- HELPERS ---------- */
const STD = (color,o={}) => new THREE.MeshStandardMaterial(Object.assign({color},o));
const BAS = (color,o={}) => new THREE.MeshBasicMaterial(Object.assign({color},o));
function mesh(geo,mat,x=0,y=0,z=0,parent){
  const m = new THREE.Mesh(geo,mat); m.position.set(x,y,z);
  if(parent) parent.add(m);
  return m;
}
const GOLD = STD(0xffcc33,{metalness:.7,roughness:.3,emissive:0x442200});

// Soft radial glow texture (128x128) shared by every particle system and sprite
const glowTex = (()=>{
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d'), g = x.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(.25,'rgba(255,255,255,.65)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
})();
function glowSprite(color,scale){
  const s = new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
  s.scale.set(scale,scale,1);
  return s;
}
function glowPoints(geo,color,size){
  return new THREE.Points(geo,new THREE.PointsMaterial({color,size,map:glowTex,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true}));
}

// Sharp 1024px banner texture with double gold border (call after fonts are ready)
function fitText(x,text,maxW,size,weight){
  x.font = weight+' '+size+'px Fredoka, sans-serif';
  while(x.measureText(text).width > maxW && size > 12){
    size -= 2; x.font = weight+' '+size+'px Fredoka, sans-serif';
  }
}
function bannerTexture(bg,gold,title,sub,h){
  const w = 1024, c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d');
  x.fillStyle = bg; x.fillRect(0,0,w,h);
  x.strokeStyle = gold; x.lineWidth = 12; x.strokeRect(14,14,w-28,h-28);
  x.lineWidth = 4; x.strokeRect(36,36,w-72,h-72);
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillStyle = '#fff';
  fitText(x,title,w-170,h*(sub?.3:.34),'700');
  x.fillText(title,w/2,sub?h*.38:h*.5);
  if(sub){
    x.fillStyle = '#ffe596';
    fitText(x,sub,w-170,h*.22,'600');
    x.fillText(sub,w/2,h*.68);
  }
  const t = new THREE.CanvasTexture(c);
  t.anisotropy = maxAniso; t.needsUpdate = true;
  return t;
}

/* ---------- SKY, STARS, SKYLINE ---------- */
const sp = new Float32Array(650*3);
for(let i=0;i<650;i++){
  sp[i*3] = (Math.random()-.5)*180;
  sp[i*3+1] = 10+Math.random()*65;
  sp[i*3+2] = -60+(Math.random()-.5)*70;
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(sp,3));
scene.add(glowPoints(starGeo,0xfff4d2,.9));
for(let i=-14;i<=14;i++){
  const bh = 4+Math.random()*10, bw = 2.2+Math.random()*1.5;
  mesh(new THREE.BoxGeometry(bw,bh,2.5), BAS(0x13041a), i*3.1, bh/2, -45, scene);
}

/* ---------- STREET ---------- */
const world = new THREE.Group(); scene.add(world);
const ground = mesh(new THREE.PlaneGeometry(42,65), STD(0x8c5358,{roughness:.85}), 0,0,0, world);
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true;

function building(x,z,w,h,d,wall,trim,rotY){
  const g = new THREE.Group(); g.position.set(x,0,z); g.rotation.y = rotY;
  const body = mesh(new THREE.BoxGeometry(w,h,d), STD(wall,{roughness:.65}), 0,h/2,0, g);
  body.castShadow = body.receiveShadow = true;
  mesh(new THREE.BoxGeometry(w+.4,.5,d+.4), STD(trim), 0,h+.25,0, g);
  const winMat = BAS(0xffe28a);
  for(let wy=2.4; wy<h-1.2; wy+=3)
    for(const wx of [-w/3, w/3]) mesh(new THREE.BoxGeometry(.95,1.45,.15), winMat, wx,wy,d/2+.05, g);
  world.add(g);
}
const L = Math.PI/2, R = -Math.PI/2;
building(-9.5,10,6,9.5,6,0xd9385a,0xffae34,L);
building(-9.5,2.5,6,11,6,0x3b78d8,0xffd15c,L);
building(-9.5,-5.5,6.5,9,6,0xf27d32,0xffe484,L);
building(9.5,10,6,10,6,0x8b46c7,0xffc64b,R);
building(9.5,2,7,8.5,6,0xff9f40,0xc92a42,R);
building(9.5,-6,6,10.5,6,0x2ca68c,0xffdf71,R);

/* ---------- PARTICLES: FIREWORKS, SPARKLES, PHULJHADI ---------- */
const bursts = [];
function burst(pos,color,n=90,speed=7,size=1.2,life=1.6,grav=5){
  const arr = new Float32Array(n*3), vel = [];
  for(let i=0;i<n;i++){
    arr.set([pos.x,pos.y,pos.z],i*3);
    const th = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1), s = speed*(.45+Math.random()*.55);
    vel.push(Math.sin(ph)*Math.cos(th)*s, Math.cos(ph)*s, Math.sin(ph)*Math.sin(th)*s);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(arr,3));
  const pts = glowPoints(g,color,size); pts.frustumCulled = false; scene.add(pts);
  bursts.push({pts,vel,t:0,life,grav,n});
}
function updateBursts(dt){
  for(let k=bursts.length-1;k>=0;k--){
    const b = bursts[k]; b.t += dt;
    const a = b.pts.geometry.attributes.position.array;
    for(let i=0;i<b.n;i++){
      b.vel[i*3+1] -= b.grav*dt;
      a[i*3] += b.vel[i*3]*dt; a[i*3+1] += b.vel[i*3+1]*dt; a[i*3+2] += b.vel[i*3+2]*dt;
    }
    b.pts.geometry.attributes.position.needsUpdate = true;
    b.pts.material.opacity = Math.max(0,1-b.t/b.life);
    if(b.t>=b.life){ scene.remove(b.pts); b.pts.geometry.dispose(); b.pts.material.dispose(); bursts.splice(k,1); }
  }
}

        e.vel[j+1] -= 4*dt;

const petals = [], petalGeo = new THREE.SphereGeometry(.09,8,6);
const petalMats = [0xffb300,0xff7a00,0xffd23f,0xff5a1f].map(c=>BAS(c,{side:THREE.DoubleSide}));
function spawnPetals(){
  for(let i=0;i<45;i++){
    const m = new THREE.Mesh(petalGeo,petalMats[i%4]);
    m.scale.set(1.4,.3,.9); m.visible = false;
    m.position.set(-2.2+(Math.random()-.5)*7, 7+Math.random()*3, -7.6+(Math.random()-.5)*2.4);
    scene.add(m);
    petals.push({m,x0:m.position.x,delay:Math.random()*2.2,fall:.8+Math.random()*.7,amp:.25+Math.random()*.35,ph:Math.random()*6.28,freq:1.2+Math.random()*1.2,spin:1+Math.random()*3});
  }
}
function updatePetals(dt,t){
  for(let i=petals.length-1;i>=0;i--){
    const p = petals[i];
    if(p.delay>0){ p.delay -= dt; if(p.delay<=0) p.m.visible = true; continue; }
    p.m.position.y -= p.fall*dt;
    p.m.position.x = p.x0+Math.sin(t*p.freq+p.ph)*p.amp;
    p.m.position.z += Math.cos(t*p.freq*.8+p.ph)*.15*dt;
    p.m.rotation.x += p.spin*dt; p.m.rotation.z += p.spin*.6*dt;
    if(p.m.position.y<.15){ scene.remove(p.m); petals.splice(i,1); }
  }
}

    mesh(new THREE.CylinderGeometry(.5,.36,1,14,1,true), BAS(0xff9a3c,{side:THREE.DoubleSide,transparent:true,opacity:.92,fog:false}), 0,0,0, g);
    mesh(new THREE.CircleGeometry(.5,14), BAS(0xffc46b,{side:THREE.DoubleSide,fog:false}), 0,.5,0, g).rotation.x = -Math.PI/2;
    mesh(new THREE.SphereGeometry(.14,10,10), BAS(0xfff2a8,{fog:false}), 0,-.35,0, g);
    const h = glowSprite(0xff9a3c,3.2); h.material.fog = false; g.add(h);
    g.visible = false; g.scale.setScalar(.01); scene.add(g);
    const l = {g,side:i%2?1:-1,delay:i*.6};
    placeLantern(l,true); lanterns.push(l);
  }
}
let heart = null;
function launchHeart(){
  const s = new THREE.Shape();
  s.moveTo(0,-.6);
  s.bezierCurveTo(-.2,-.4,-.8,-.1,-.8,.25); s.bezierCurveTo(-.8,.65,-.3,.8,0,.45);
  s.bezierCurveTo(.3,.8,.8,.65,.8,.25);     s.bezierCurveTo(.8,-.1,.2,-.4,0,-.6);
  const geo = new THREE.ExtrudeGeometry(s,{depth:.3,bevelEnabled:true,bevelSize:.05,bevelThickness:.06,bevelSegments:3,curveSegments:24});
  geo.center();
  const g = new THREE.Group();
  g.add(new THREE.Mesh(geo,STD(0xff3d6e,{emissive:0xff1f55,emissiveIntensity:.9,roughness:.35,metalness:.1})));
  g.add(glowSprite(0xff5a8a,3));
  g.position.set(0,2.2,15.5); g.scale.setScalar(.01); couple.parent.add(g);
  heart = {g,age:0};
  burst(new THREE.Vector3(0,2.4,15.5),0xff7aa5,40,1.6,.3,1.6,-.6);
}
function updateSky(dt,t){
  lanterns.forEach(l=>{
    if(l.delay>0){ l.delay -= dt; if(l.delay<=0) l.g.visible = true; return; }
    l.age += dt; l.g.position.y += l.rise*dt;
    l.g.position.x = l.x0+Math.sin(t*.7+l.ph)*.9;
    l.g.scale.setScalar(2.6*Math.min(1,l.age/1.2));
    if(l.g.position.y>l.top) placeLantern(l,false);
  });
  if(heart){
    heart.age += dt;
    const a = heart.age;
    heart.g.position.y = 2.2+2.4*(1-Math.exp(-a*.35))+Math.sin(t*1.4)*.04;
    heart.g.position.x = Math.sin(t*1.5)*.08;
    heart.g.rotation.y = Math.sin(t*1.2)*.6;
    heart.g.scale.setScalar(.42*(1+.08*Math.sin(t*5))*Math.min(1,a/.8));
  }
}

/* ---------- ROMANTIC EXTRAS ---------- */
// Pointer sparkle + mini-heart trail (2D overlay)
let trail = null, tc = null; const tdpr = Math.min(devicePixelRatio||1,2);
try{ trail = document.getElementById('trail'); tc = trail.getContext('2d'); }catch(e){ tc = null; }
function sizeTrail(){ if(!tc) return; trail.width = innerWidth*tdpr; trail.height = innerHeight*tdpr; tc.setTransform(tdpr,0,0,tdpr,0,0); }
sizeTrail(); addEventListener('resize',sizeTrail);
const goldSpr = (()=>{ const c = document.createElement('canvas'); c.width = c.height = 48; const x = c.getContext('2d'), g = x.createRadialGradient(24,24,0,24,24,24);
  g.addColorStop(0,'rgba(255,240,170,1)'); g.addColorStop(.35,'rgba(255,200,70,.7)'); g.addColorStop(1,'rgba(255,170,30,0)'); x.fillStyle = g; x.fillRect(0,0,48,48); return c; })();
const tps = []; let lastX = -99, lastY = -99;
function spawnTrail(x,y,n,heartP){
  for(let i=0;i<n && tps.length<260;i++) tps.push({x:x+(Math.random()-.5)*10,y:y+(Math.random()-.5)*10,vx:(Math.random()-.5)*40,vy:(Math.random()-.5)*40-10,t:0,max:.5+Math.random()*.5,s:5+Math.random()*7,h:false});
  if(Math.random()<heartP) tps.push({x,y,vx:(Math.random()-.5)*30,vy:-30-Math.random()*30,t:0,max:1+Math.random()*.6,s:5+Math.random()*5,h:true});
}
function drawTrail(dt){
  if(!tc) return;
  tc.clearRect(0,0,innerWidth,innerHeight); tc.globalCompositeOperation = 'lighter';
  for(let i=tps.length-1;i>=0;i--){
    const p = tps[i]; p.t += dt;
    if(p.t>=p.max){ tps.splice(i,1); continue; }
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += (p.h?-10:30)*dt;
    tc.globalAlpha = 1-p.t/p.max;
    if(p.h){
      const q = p.s; tc.fillStyle = '#ff6b97'; tc.beginPath();
      tc.moveTo(p.x,p.y+q*.9); tc.bezierCurveTo(p.x-q*1.6,p.y-q*.1,p.x-q*.8,p.y-q*1.1,p.x,p.y-q*.4);
      tc.bezierCurveTo(p.x+q*.8,p.y-q*1.1,p.x+q*1.6,p.y-q*.1,p.x,p.y+q*.9); tc.fill();
    } else tc.drawImage(goldSpr,p.x-p.s,p.y-p.s,p.s*2,p.s*2);
  }
  tc.globalAlpha = 1;
}
addEventListener('pointermove',e=>{
  if(!tc) return;
  if(Math.hypot(e.clientX-lastX,e.clientY-lastY)<12) return;
  lastX = e.clientX; lastY = e.clientY; spawnTrail(lastX,lastY,2,.25);
});
addEventListener('pointerdown',e=>{ try{ lastX = e.clientX; lastY = e.clientY; if(tc) spawnTrail(lastX,lastY,10,.7); tapLaddoo(e); }catch(err){} });

// Toast
const toastEl = document.getElementById('toast'); let toastTimer = null;
function showToast(msg,ms=3600){ if(!toastEl) return; toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(()=>toastEl.classList.remove('show'),ms); }

// Floating laddoo: auto after the box opens, or tap one
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(); let boxOpen = false;
function tapLaddoo(e){
  if(!boxOpen) return;
  ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1); ray.setFromCamera(ndc,camera);
  const h = ray.intersectObjects(hitboxes,false)[0]; if(h) floatLaddoo(h.object.userData.l);
}
function floatLaddoo(l){
  if(l.userData.busy) return; l.userData.busy = true;
  scene.attach(l);
  const dir = new THREE.Vector3(); camera.getWorldDirection(dir);
  const tgt = camera.position.clone().add(dir.multiplyScalar(2.4)); tgt.y -= .25;
  gsap.to(l.position,{x:tgt.x,y:tgt.y,z:tgt.z,duration:1.3,ease:'power2.out'});
  gsap.to(l.scale,{x:1.7,y:1.7,z:1.7,duration:1.3,ease:'power2.out'});
  gsap.to(l.rotation,{y:Math.PI*2,duration:1.3});
  playChime(784); showToast('Ek meetha laddoo mere Kuchupuchu ke liye! 🍬❤️');
  wait(1.3,()=>{ burst(tgt,0xffc2d9,40,1.8,.3,1.2,.4); playChime(988); });
  wait(3.8,()=>gsap.to(l.scale,{x:0,y:0,z:0,duration:.4,ease:'back.in(2)'}));
}

// Finale: couple turns toward each other, cheeks glow
function headTurn(){ try{ _headTurn(); }catch(e){} }
function _headTurn(){
  gsap.to(boy.rotation,{y:.5,duration:1.2,ease:'power2.inOut'});
  gsap.to(girlP.rotation,{y:-.5,duration:1.2,ease:'power2.inOut'});
  [boy,girlP].forEach(p=>p.userData.cheeks.forEach(c=>{
    c.material.color.setHex(0xff3d6b); gsap.to(c.material,{opacity:1,duration:1}); gsap.to(c.scale,{x:1.4,y:1.4,duration:1});
  }));
}

// Heart-shaped sky firework behind the mandir spire
function heartBurst(pos,color,k,n,size){
  burst(pos,color,n,0,size,2.8,.25);
  const b = bursts[bursts.length-1];
  for(let i=0;i<n;i++){
    const t = i/n*Math.PI*2, sc = .9+Math.random()*.1;
    b.vel[i*3] = 16*Math.pow(Math.sin(t),3)*k*sc;
    b.vel[i*3+1] = (13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*k*sc;
    b.vel[i*3+2] = (Math.random()-.5)*.4;
  }
}
function heartSky(){ try{ _heartSky(); }catch(e){} }
function _heartSky(){
  playFireworkPop(.45);
  heartBurst(new THREE.Vector3(-2.2,15.5,-22),0xff5c9a,.3,120,2.2);
  heartBurst(new THREE.Vector3(-2.2,15.5,-22.5),0xffcc4d,.19,70,2.0);
}

/* ---------- BANNERS (drawn only after fonts are ready) ---------- */
function buildBanners(){
  const archTex = bannerTexture('#b81d38','#ffcf5a',CONFIG.bannerMainText+' 🪔',CONFIG.bannerSubText,252);
  mesh(new THREE.PlaneGeometry(12.2,3.0), BAS(0xffffff,{map:archTex}), 0,6.4,.19, arch);
  const signTex = bannerTexture('#3b1219','#ffcf5a','MithaiGhar','Fresh Mithai 🍬',270);
  mesh(new THREE.PlaneGeometry(3.6,.95), BAS(0xffffff,{map:signTex}), 0,0,.11, mithaiSign);
  const loveTex = bannerTexture('#7a1630','#ffcf5a',CONFIG.sweetCardTop,CONFIG.sweetCardBottom,836);
  const note = mesh(new THREE.PlaneGeometry(1.0,.82), BAS(0xffffff,{map:loveTex}), 0,-.006,.45, lidPivot);
  note.rotation.x = Math.PI/2;   // inner (underside) face of the lid
}
Promise.all([
  document.fonts.load('700 48px Fredoka'),
  document.fonts.load('600 48px Fredoka'),
  document.fonts.load('700 48px "Dancing Script"')
]).catch(()=>{}).then(()=>document.fonts.ready).then(buildBanners);

/* ---------- CAMERA SHOTS ---------- */
function moveCam(pos,look,dur=2){
  gsap.to(camera.position,{x:pos[0],y:pos[1],z:pos[2],duration:dur,ease:'power2.inOut'});
  gsap.to(cameraTarget,{x:look[0],y:look[1],z:look[2],duration:dur,ease:'power2.inOut'});
}
// distance is computed from the real horizontal FOV so the 12.2-unit banner always fits
function welcomeShot(){
  const tH = Math.tan(camera.fov*Math.PI/360)*camera.aspect;
  const d = Math.max(14,(6.6/tH)*1.05);
  return {pos:[0,5+d*.12,13.5+d], look:[0,5,13.5]};
}
const SHOT = {
  door:   ()=>({pos:[.5,2.3,10],  look:[-5.5,.9,10]}),
  mandir: ()=>({pos:[-3.5,4.2,2], look:[-2.2,4,-11.5]}),
  glow:   ()=>({pos:[0,9.5,10.5], look:[0,3,-6]}),            // z < 11.5: stays in front of the welcome arch
  mithai: ()=>({pos:[-1.2,3.2,3.4], look:[5.4,1.9,2]}),
  finale: ()=>({pos:[0,2.6,22.5], look:[0,3.4,15.2]})
};
function go(s,dur){ moveCam(s.pos,s.look,dur); }

/* ---------- UI + STEPS ---------- */
const btn = document.getElementById('action-btn'), hint = document.getElementById('hint-banner'), title = document.getElementById('sky-title');
function setHint(t){ hint.classList.remove('show'); setTimeout(()=>{ if(t){ hint.textContent = t; hint.classList.add('show'); } },200); }
function setBtn(label){
  btn.classList.remove('active');
  if(label){ setTimeout(()=>{ btn.textContent = label; btn.classList.add('active'); },350); }
}
const wait = (s,fn)=>gsap.delayedCall(s,fn);

const steps = [
  function welcome(){
    title.classList.add('visible'); setHint('');
    [0,.5,1,1.5,2].forEach(d=>wait(d,()=>skyFirework((Math.random()-.5)*50,26+Math.random()*14,-28)));
    wait(2.6,()=>{ title.classList.remove('visible'); go(welcomeShot(),2.4); });
    wait(5,()=>{ setHint('Welcome to our Diwali street 🪔'); setBtn('Light the Diyas 🪔'); });
  },
  function lightDiyas(){
    setHint('Lighting the diyas…'); setBtn(null); go(SHOT.door(),2);
    diyas.forEach((d,i)=>wait(2.2+i*.5,()=>{
      d.flame.visible = d.halo.visible = true;
      gsap.to(d.k,{v:1,duration:.6}); playIgnite(i);
    }));
    wait(4,()=>{ setHint('Our diyas are glowing 🪔'); setBtn('Ring the Mandir Bell 🔔'); });
  },
  function ringBell(){
    setHint('To the mandir…'); setBtn(null); go(SHOT.mandir(),2.4);
    wait(2.6,()=>{
      playTempleBell(); spawnPetals();
      gsap.fromTo(bellPivot.rotation,{z:-.5},{z:0,duration:2.4,ease:'elastic.out(1,.25)'});
      const p = new THREE.Vector3(); bellPivot.getWorldPosition(p); p.y -= .6;
      burst(p,0xffd45c,45,2.4,.28,1.3,.8);
      wait(.4,()=>burst(p,0xfff0b0,35,1.8,.25,1.2,.6));
      setHint('Ding dong… blessings 🙏');
    });
    wait(5,()=>setBtn('Light Up the Street ✨'));
  },
  function streetGlow(){
    setHint('Watch the street glow…'); setBtn(null); go(SHOT.glow(),3.2);
    wait(.6,playWindChimes); wait(2.4,playWindChimes);
    const cols = [0xffd36b,0xff7a95,0x7fe3ff,0xffa24a,0xc9a0ff];
    bulbs.forEach((b,i)=>wait(.6+i*.05,()=>{
      const c = cols[i%cols.length];
      b.material.color.setHex(c); b.userData.halo.material.color.setHex(c); b.userData.halo.visible = true;
    }));
    wait(1.2,()=>{
      const gp = {v:streetGlow.intensity}; gsap.to(gp,{v:2.4,duration:1.5,onUpdate:()=>{ streetGlow.intensity = gp.v; }});
      kandils.forEach(k=>{ k.body.material.emissive.setHex(0xff6a00); });
    });
    wait(4.4,()=>{ go(SHOT.mithai(),2); setHint('Visit the MithaiGhar 🍬'); });
    wait(6.6,()=>setBtn('Open Sweet Box 🍬'));
  },
  function openBox(){
    setBtn(null); setHint('');
    gsap.to(lidPivot.rotation,{x:-1.85,duration:1.1,ease:'back.out(1.4)'});
    [laddoo1,laddoo2].forEach((l,i)=>gsap.fromTo(l.position,{y:.27},{y:.42,duration:.3,yoyo:true,repeat:1,delay:.5+i*.15,ease:'power2.out'}));
    playChime(740); boxOpen = true; wait(2.4,()=>floatLaddoo(laddoo2));
    wait(1.4,()=>{ playChime(988); setHint('Sweetest things, just for you ❤️'); });
    wait(3.2,()=>setBtn('Burn the Phuljhadi 🎆'));
  },
  function finale(){
    setBtn(null); setHint(''); go(SHOT.finale(),2.6);
    wait(2.8,()=>{ playFireworkPop(.2); emitters.forEach(e=>e.active = true); startSizzle(); launchLanterns(); launchHeart(); headTurn(); setHint('Make a wish… ✨'); });
    let n = 0;
    const fw = setInterval(()=>{
      skyFirework((Math.random()-.5)*14,9+Math.random()*3,6+Math.random()*3,0);
      if(++n>8){ clearInterval(fw); }
    },750);
    wait(5,heartSky); wait(8.4,heartSky);
    wait(9,()=>{ setHint(''); document.getElementById('final-card').classList.add('show'); });
    wait(15,()=>{ emitters.forEach(e=>e.active = false); stopSizzle(); });
  }
];
let stepIndex = 0;
btn.addEventListener('click',()=>{
  try{ initAudio(); startMusic(); }catch(e){}
  if(stepIndex<steps.length){ try{ steps[stepIndex++](); }catch(e){ console.error(e); } }
});

/* ---------- LOOP ---------- */
const clock = new THREE.Clock();
(function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(),.05), t = clock.elapsedTime;
  try{
  camera.lookAt(cameraTarget);
  diyas.forEach((d,i)=>{ if(d.flame.visible){ d.flame.scale.y = 1.6+Math.sin(t*12+i*2)*.25; d.light.intensity = d.k.v*(1.2+Math.sin(t*9+i)*.15); } });
  kandils.forEach((k,i)=>{ k.g.rotation.z = Math.sin(t*1.3+i)*.04; });
  bunny.position.y = Math.abs(Math.sin(t*2.2))*.05;
  couple.position.y = Math.sin(t*1.6)*.015;
  updateBursts(dt); updateEmitters(dt,t); updatePetals(dt,t); updateSky(dt,t); drawTrail(dt);
  }catch(e){ if(!window.__loopErr){ window.__loopErr = 1; console.error(e); } }
  renderer.render(scene,camera);
})();
</script>
